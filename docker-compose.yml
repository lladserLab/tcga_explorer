services:
  postgres:
    image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
    restart: unless-stopped
    environment:
      POSTGRES_DB: tcga_explorer
      POSTGRES_USER: tcga
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcga -d tcga_explorer"]
      interval: 5s
      timeout: 5s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    networks:
      - data

  migrate:
    image: ${TCGA_EXPLORER_BACKEND_IMAGE:-tcga_explorer-backend}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    command:
      - sh
      - -c
      - >-
        python3 -c 'from app.database import wait_for_database, init_db; wait_for_database(); init_db()'
        && alembic -c /app/alembic.ini upgrade head
        && python3 -m app.provision_runtime_role
    environment:
      DATABASE_URL: postgresql+psycopg://tcga:${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}@postgres:5432/tcga_explorer
      DATABASE_SCHEMA_MANAGEMENT_ENABLED: "true"
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?Set POSTGRES_RUNTIME_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    networks:
      - data

  backend:
    image: ${TCGA_EXPLORER_BACKEND_IMAGE:-tcga_explorer-backend}
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_RELEASE_COMMIT: ${APP_RELEASE_COMMIT:-development}
      APP_RELEASE_REF: ${APP_RELEASE_REF:-development}
      DATABASE_URL: postgresql+psycopg://trace_app:${POSTGRES_RUNTIME_PASSWORD:?Set POSTGRES_RUNTIME_PASSWORD in .env}@postgres:5432/tcga_explorer
      DATABASE_SCHEMA_MANAGEMENT_ENABLED: "false"
      TCGA_DATA_DIR: /data/tcga
      TCGA_CDR_PATH: /app/clinical/TCGA-CDR-SupplementalTableS1.xlsx
      CANCER_REPOSITORY_DIR: /data/cancer_repository
      CANCER_REPOSITORY_REGISTRY_DIR: /app/repository_registry
      USER_DATASET_DIR: /data/user_uploads
      USER_DATASET_RETENTION_HOURS: ${USER_DATASET_RETENTION_HOURS:-24}
      USER_DATASET_MAX_ACTIVE_PER_CLIENT: ${USER_DATASET_MAX_ACTIVE_PER_CLIENT:-3}
      USER_DATASET_EXPRESSION_MAX_BYTES: ${USER_DATASET_EXPRESSION_MAX_BYTES:-104857600}
      USER_DATASET_CLINICAL_MAX_BYTES: ${USER_DATASET_CLINICAL_MAX_BYTES:-10485760}
      USER_DATASET_MAX_SAMPLES: ${USER_DATASET_MAX_SAMPLES:-5000}
      USER_DATASET_MAX_GENES: ${USER_DATASET_MAX_GENES:-60000}
      USER_DATASET_MAX_CELLS: ${USER_DATASET_MAX_CELLS:-50000000}
      JCGA_DATA_DIR: /app/jcga
      TCGA_SYNC_STATE_DIR: /data/tcga/.sync
      CLINICAL_SYNC_STATE_DIR: /app/clinical/.sync
      ARTIFACT_DIR: /app/artifacts
      DERIVED_EXPRESSION_DIR: /app/derived/rna_bulk
      R_SCRIPT_PATH: /app/scripts/km_analysis.R
      GSEA_GENE_SET_DIR: /app/gene_sets
      CORS_ORIGINS: "${CORS_ORIGINS:-https://apps.cienciavida.org,http://localhost:3000,http://localhost:5173}"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-apps.cienciavida.org,localhost,127.0.0.1,192.168.1.31,backend,testserver}
      BOOTSTRAP_ON_STARTUP: "true"
      PRELOAD_CACHE_ON_STARTUP: "true"
      PRELOAD_CACHE_STRICT: "true"
      PRELOAD_GDC_EXPRESSION_MATRICES_ON_STARTUP: "true"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://apps.cienciavida.org/tcga_explorer}
      PUBLIC_PATH_PREFIX: ${PUBLIC_PATH_PREFIX:-/tcga_explorer}
      PUBLIC_API_ENABLED: ${PUBLIC_API_ENABLED:-true}
      ATTESTATION_ENABLED: ${ATTESTATION_ENABLED:-true}
      ATTESTATION_AUTO_GENERATE: ${ATTESTATION_AUTO_GENERATE:-true}
      ATTESTATION_PRIVATE_KEY_PATH: ${ATTESTATION_PRIVATE_KEY_PATH:-/run/attestation/ed25519-private.pem}
      ATTESTATION_ISSUER: ${ATTESTATION_ISSUER:-}
      COMPUTE_GLOBAL_CONCURRENCY: ${COMPUTE_GLOBAL_CONCURRENCY:-2}
      COMPUTE_QUEUE_MAX_SIZE: ${COMPUTE_QUEUE_MAX_SIZE:-50}
      COMPUTE_MAX_ACTIVE_PER_CLIENT: ${COMPUTE_MAX_ACTIVE_PER_CLIENT:-5}
      COMPUTE_SINGLE_HOURLY_LIMIT: ${COMPUTE_SINGLE_HOURLY_LIMIT:-25}
      COMPUTE_EXPRESSION_COMPARISON_HOURLY_LIMIT: ${COMPUTE_EXPRESSION_COMPARISON_HOURLY_LIMIT:-1000}
      COMPUTE_BATCH_HOURLY_LIMIT: ${COMPUTE_BATCH_HOURLY_LIMIT:-2}
      COMPUTE_MULTIVERSE_HOURLY_LIMIT: ${COMPUTE_MULTIVERSE_HOURLY_LIMIT:-1}
      COMPUTE_PANCANCER_HOURLY_LIMIT: ${COMPUTE_PANCANCER_HOURLY_LIMIT:-2}
      COMPUTE_SESSION_HOURLY_LIMIT: ${COMPUTE_SESSION_HOURLY_LIMIT:-5}
      COMPUTE_STALE_SECONDS: ${COMPUTE_STALE_SECONDS:-1800}
      COMPUTE_MAX_ATTEMPTS: ${COMPUTE_MAX_ATTEMPTS:-2}
      PUBLIC_BATCH_MAX_ANALYSES: ${PUBLIC_BATCH_MAX_ANALYSES:-25}
      PUBLIC_MULTIVERSE_MAX_ANALYSES: ${PUBLIC_MULTIVERSE_MAX_ANALYSES:-72}
      ARTIFACT_RETENTION_DAYS: ${ARTIFACT_RETENTION_DAYS:-90}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-apps.cienciavida.org,apps.cienciavida.org:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*,testserver}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-https://apps.cienciavida.org,https://chatgpt.com,https://chat.openai.com,https://claude.ai,http://localhost:3000,http://localhost:5173}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 120
      start_period: 60m
    volumes:
      - ../TCGA:/data/tcga:ro
      - ${CANCER_REPOSITORY_HOST_DIR:-./external_repository}:/data/cancer_repository:ro
      - ./user_uploads:/data/user_uploads
      - ./artifacts:/app/artifacts
      - ./derived:/app/derived
      - ./clinical:/app/clinical:ro
      - ./jcga:/app/jcga:ro
      - attestation_keys:/run/attestation
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 768
    mem_limit: 4g
    cpus: 4.0
    networks:
      - app
      - data
      - egress

  worker:
    image: ${TCGA_EXPLORER_BACKEND_IMAGE:-tcga_explorer-backend}
    command: ["python3", "-m", "app.worker"]
    environment:
      APP_RELEASE_COMMIT: ${APP_RELEASE_COMMIT:-development}
      APP_RELEASE_REF: ${APP_RELEASE_REF:-development}
      DATABASE_URL: postgresql+psycopg://trace_app:${POSTGRES_RUNTIME_PASSWORD:?Set POSTGRES_RUNTIME_PASSWORD in .env}@postgres:5432/tcga_explorer
      DATABASE_SCHEMA_MANAGEMENT_ENABLED: "false"
      TCGA_DATA_DIR: /data/tcga
      TCGA_CDR_PATH: /app/clinical/TCGA-CDR-SupplementalTableS1.xlsx
      CANCER_REPOSITORY_DIR: /data/cancer_repository
      CANCER_REPOSITORY_REGISTRY_DIR: /app/repository_registry
      USER_DATASET_DIR: /data/user_uploads
      USER_DATASET_RETENTION_HOURS: ${USER_DATASET_RETENTION_HOURS:-24}
      USER_DATASET_MAX_ACTIVE_PER_CLIENT: ${USER_DATASET_MAX_ACTIVE_PER_CLIENT:-3}
      USER_DATASET_EXPRESSION_MAX_BYTES: ${USER_DATASET_EXPRESSION_MAX_BYTES:-104857600}
      USER_DATASET_CLINICAL_MAX_BYTES: ${USER_DATASET_CLINICAL_MAX_BYTES:-10485760}
      USER_DATASET_MAX_SAMPLES: ${USER_DATASET_MAX_SAMPLES:-5000}
      USER_DATASET_MAX_GENES: ${USER_DATASET_MAX_GENES:-60000}
      USER_DATASET_MAX_CELLS: ${USER_DATASET_MAX_CELLS:-50000000}
      JCGA_DATA_DIR: /app/jcga
      TCGA_SYNC_STATE_DIR: /data/tcga/.sync
      CLINICAL_SYNC_STATE_DIR: /app/clinical/.sync
      ARTIFACT_DIR: /app/artifacts
      DERIVED_EXPRESSION_DIR: /app/derived/rna_bulk
      R_SCRIPT_PATH: /app/scripts/km_analysis.R
      GSEA_GENE_SET_DIR: /app/gene_sets
      BOOTSTRAP_ON_STARTUP: "false"
      PRELOAD_CACHE_ON_STARTUP: "false"
      PRELOAD_CACHE_STRICT: "false"
      PRELOAD_GDC_EXPRESSION_MATRICES_ON_STARTUP: "false"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://apps.cienciavida.org/tcga_explorer}
      PUBLIC_PATH_PREFIX: ${PUBLIC_PATH_PREFIX:-/tcga_explorer}
      ATTESTATION_ENABLED: ${ATTESTATION_ENABLED:-true}
      ATTESTATION_AUTO_GENERATE: ${ATTESTATION_AUTO_GENERATE:-true}
      ATTESTATION_PRIVATE_KEY_PATH: ${ATTESTATION_PRIVATE_KEY_PATH:-/run/attestation/ed25519-private.pem}
      ATTESTATION_ISSUER: ${ATTESTATION_ISSUER:-}
      COMPUTE_GLOBAL_CONCURRENCY: ${COMPUTE_GLOBAL_CONCURRENCY:-2}
      COMPUTE_QUEUE_MAX_SIZE: ${COMPUTE_QUEUE_MAX_SIZE:-50}
      COMPUTE_MAX_ACTIVE_PER_CLIENT: ${COMPUTE_MAX_ACTIVE_PER_CLIENT:-5}
      COMPUTE_SINGLE_HOURLY_LIMIT: ${COMPUTE_SINGLE_HOURLY_LIMIT:-25}
      COMPUTE_EXPRESSION_COMPARISON_HOURLY_LIMIT: ${COMPUTE_EXPRESSION_COMPARISON_HOURLY_LIMIT:-1000}
      COMPUTE_BATCH_HOURLY_LIMIT: ${COMPUTE_BATCH_HOURLY_LIMIT:-2}
      COMPUTE_MULTIVERSE_HOURLY_LIMIT: ${COMPUTE_MULTIVERSE_HOURLY_LIMIT:-1}
      COMPUTE_PANCANCER_HOURLY_LIMIT: ${COMPUTE_PANCANCER_HOURLY_LIMIT:-2}
      COMPUTE_SESSION_HOURLY_LIMIT: ${COMPUTE_SESSION_HOURLY_LIMIT:-5}
      COMPUTE_STALE_SECONDS: ${COMPUTE_STALE_SECONDS:-1800}
      COMPUTE_MAX_ATTEMPTS: ${COMPUTE_MAX_ATTEMPTS:-2}
      PUBLIC_BATCH_MAX_ANALYSES: ${PUBLIC_BATCH_MAX_ANALYSES:-25}
      PUBLIC_MULTIVERSE_MAX_ANALYSES: ${PUBLIC_MULTIVERSE_MAX_ANALYSES:-72}
      ARTIFACT_RETENTION_DAYS: ${ARTIFACT_RETENTION_DAYS:-90}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-apps.cienciavida.org,apps.cienciavida.org:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*,testserver}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-https://apps.cienciavida.org,https://chatgpt.com,https://chat.openai.com,https://claude.ai,http://localhost:3000,http://localhost:5173}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-apps.cienciavida.org,localhost,127.0.0.1,192.168.1.31,backend,testserver}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ../TCGA:/data/tcga:ro
      - ${CANCER_REPOSITORY_HOST_DIR:-./external_repository}:/data/cancer_repository:ro
      - ./user_uploads:/data/user_uploads
      - ./artifacts:/app/artifacts
      - ./derived:/app/derived
      - ./clinical:/app/clinical:ro
      - ./jcga:/app/jcga:ro
      - attestation_keys:/run/attestation
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=2g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    mem_limit: 6g
    cpus: 6.0
    networks:
      - data

  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/tcga_explorer/}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/tcga_explorer}
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    volumes:
      - ${TRACE_DESKTOP_DOWNLOAD_DIR:-./downloads/desktop}:/usr/share/nginx/html/downloads/desktop:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,nosuid,nodev,size=32m
      - /var/run:rw,nosuid,nodev,size=4m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    networks:
      - app

  nginx:
    image: nginx:stable-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    ports:
      - "${TCGA_EXPLORER_HTTP_BIND:-127.0.0.1}:${TCGA_EXPLORER_HTTP_PORT:-3000}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,nosuid,nodev,size=32m
      - /var/run:rw,nosuid,nodev,size=4m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    networks:
      - app

  updater:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles:
      - tools
    environment:
      DATABASE_URL: postgresql+psycopg://tcga:${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}@postgres:5432/tcga_explorer
      TCGA_DATA_DIR: /data/tcga
      TCGA_CDR_PATH: /app/clinical/TCGA-CDR-SupplementalTableS1.xlsx
      CANCER_REPOSITORY_DIR: /data/cancer_repository
      CANCER_REPOSITORY_REGISTRY_DIR: /app/repository_registry
      JCGA_DATA_DIR: /app/jcga
      TCGA_SYNC_STATE_DIR: /data/tcga/.sync
      CLINICAL_SYNC_STATE_DIR: /app/clinical/.sync
      ARTIFACT_DIR: /app/artifacts
      DERIVED_EXPRESSION_DIR: /app/derived/rna_bulk
      R_SCRIPT_PATH: /app/scripts/km_analysis.R
      GSEA_GENE_SET_DIR: /app/gene_sets
      BOOTSTRAP_ON_STARTUP: "false"
      PRELOAD_CACHE_ON_STARTUP: "false"
      PRELOAD_CACHE_STRICT: "false"
      PRELOAD_GDC_EXPRESSION_MATRICES_ON_STARTUP: "false"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../TCGA:/data/tcga
      - ${CANCER_REPOSITORY_HOST_DIR:-./external_repository}:/data/cancer_repository
      - ./artifacts:/app/artifacts
      - ./derived:/app/derived
      - ./clinical:/app/clinical
      - ./jcga:/app/jcga:ro
    entrypoint: ["python3", "-m", "app.data_sync.cli"]
    command: ["check", "--source", "all"]
    networks:
      - data
      - egress

  repository-admin:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles:
      - tools
    environment:
      DATABASE_URL: postgresql+psycopg://tcga:${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}@postgres:5432/tcga_explorer
      CANCER_REPOSITORY_DIR: /data/cancer_repository
      CANCER_REPOSITORY_REGISTRY_DIR: /app/repository_registry
      BOOTSTRAP_ON_STARTUP: "false"
      PRELOAD_CACHE_ON_STARTUP: "false"
      PRELOAD_CACHE_STRICT: "false"
      PRELOAD_GDC_EXPRESSION_MATRICES_ON_STARTUP: "false"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${CANCER_REPOSITORY_HOST_DIR:-./external_repository}:/data/cancer_repository
      - ${CANCER_REPOSITORY_HOST_DIR:-./external_repository}:/repository:ro
      - ${CANCER_REPOSITORY_STAGING_HOST_DIR:-./external_repository_staging}:/data/cancer_repository_staging
      - ./repository_registry:/app/repository_registry:ro
    entrypoint: ["python3", "-m", "app.repository.cli"]
    command: ["coverage-report"]
    networks:
      - data
      - egress

volumes:
  postgres_data:
  attestation_keys:

networks:
  app:
  data:
    internal: true
  egress:
