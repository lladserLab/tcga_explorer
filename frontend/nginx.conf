server {
  listen 80;
  server_name _;
  server_tokens off;
  absolute_redirect off;
  client_max_body_size 1m;
  root /usr/share/nginx/html;
  index index.html;

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location = /site.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location ~* ^/(brand|icons|social)/ {
    try_files $uri =404;
  }

  location ~* ^/(favicon(?:-[0-9]+x[0-9]+)?\.(?:png|ico)|apple-touch-icon\.png)$ {
    try_files $uri =404;
  }

  location = /methods/signature-scoring {
    return 308 /methods/signature-scoring/$is_args$args;
  }

  location = /methods/signature-scoring/ {
    add_header Cache-Control "no-cache" always;
    try_files /methods/signature-scoring/index.html =404;
  }

  location / {
    try_files $uri /index.html;
  }

  location = /tutorial-videos/manifest.json {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }

  location /tutorial-videos/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Installers live in a separate read-only mount, outside the frontend image.
  location ^~ /downloads/desktop/ {
    default_type application/octet-stream;
    types { }
    try_files $uri =404;
    limit_except GET { deny all; }
    add_header Content-Disposition "attachment";
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
