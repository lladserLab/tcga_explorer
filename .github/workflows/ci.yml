name: CI

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  docker-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check patch integrity
        run: git diff --check

      - name: Scan committed source for secrets
        run: >-
          docker run --rm
          -v "$PWD:/repo:ro"
          zricethezav/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          git --config /repo/.gitleaks.toml --redact --no-banner /repo

      - name: Build backend image
        run: docker compose build backend

      - name: Run backend tests
        run: |
          docker compose run --rm --no-deps \
            -v "$PWD/backend/tests:/app/tests:ro" \
            backend pytest -q /app/tests

      - name: Check publication script syntax
        run: |
          docker compose run --rm --no-deps \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            backend python3 - <<'PY'
          from pathlib import Path

          count = 0
          for path in sorted(Path("scripts/publication").glob("*.py")):
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
              count += 1
          print(f"Publication script syntax OK: {count} files")
          PY

      - name: Run publication script tests
        run: |
          docker compose run --rm --no-deps \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            backend pytest -q -p no:cacheprovider scripts/publication/tests

      - name: Run standalone CLI tests
        run: |
          python3 -m py_compile scripts/tcga_trace_cli.py
          docker compose run --rm --no-deps \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            backend pytest -q -p no:cacheprovider scripts/tests

      - name: Check project identity
        run: python3 scripts/publication/check_project_identity.py

      - name: Run frontend tests
        run: |
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -w /tmp \
            node:22-alpine \
            sh -lc 'cp -R /workspace/frontend /tmp/frontend && cd /tmp/frontend && npm ci --silent && npm test'

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t tcga-trace-frontend-check .

  clean-reproduction:
    name: Independent clean-capsule reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rebuild pinned R environment and rerun frozen capsules
        run: >-
          python3 scripts/publication/run_clean_reproduction_benchmark.py
          --build
          --platform native
          --image-prefix tcga-trace-reproduction:ci

      - name: Verify checksummed results
        run: >-
          python3 scripts/publication/run_clean_reproduction_benchmark.py
          --check-only

      - name: Upload independent-run evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clean-reproduction-${{ github.sha }}
          path: docs/publication/benchmark/clean_container_reproduction/
          if-no-files-found: error
