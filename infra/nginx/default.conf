map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=tcga_public_api:10m rate=2r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 2g;
    limit_req_status 429;
    resolver 127.0.0.11 valid=30s ipv6=off;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;

    set $backend_upstream backend:8000;
    set $frontend_upstream frontend:80;

    location = / {
        return 302 /tcga_explorer/;
    }

    location = /tcga_explorer {
        return 301 /tcga_explorer/;
    }

    location = /api {
        return 301 /api/;
    }

    location = /tcga_explorer/api {
        return 301 /tcga_explorer/api/;
    }

    # Operational endpoints remain available to containers, but are not public.
    location = /tcga_explorer/api/cache/status {
        return 404;
    }

    location = /tcga_explorer/api/data-sync/status {
        return 404;
    }

    location = /api/cache/status {
        return 404;
    }

    location = /api/data-sync/status {
        return 404;
    }

    location /tcga_explorer/api/v1/ {
        rewrite ^/tcga_explorer/api/(.*)$ /api/$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        send_timeout 300s;
        # Bounded external-covariate datasets can be repeated across a public
        # batch request; Pydantic still enforces row, variable and value limits.
        client_max_body_size 64m;
        limit_req zone=tcga_public_api burst=30 nodelay;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /tcga_explorer;
    }

    location ~ ^/tcga_explorer/mcp/?$ {
        rewrite ^ /mcp break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        send_timeout 300s;
        client_max_body_size 64m;
        limit_req zone=tcga_public_api burst=30 nodelay;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tcga_explorer/api/ {
        rewrite ^/tcga_explorer/api/(.*)$ /api/$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /tcga_explorer/api;
    }

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
    }

    location /tcga_explorer/ {
        rewrite ^/tcga_explorer/(.*)$ /$1 break;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /tcga_explorer;
    }

    location /assets/ {
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
