map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map "$request_uri|$upstream_http_content_type" $trace_cache_control {
    default '';
    ~^/(tcga_explorer/)?tutorial-videos/manifest\.json 'no-cache';
    ~^/(tcga_explorer/)?assets/ 'public, max-age=31536000, immutable';
    ~^/(tcga_explorer/)?tutorial-videos/.*\.(mp4|jpg) 'public, max-age=31536000, immutable';
    ~*\|text/html 'no-cache';
}

limit_req_zone $binary_remote_addr zone=tcga_public_api:10m rate=2r/s;
# Reading the reference and its local assets must not consume analysis/API
# bursts. Keep a separate bounded allowance for this read-only surface.
limit_req_zone $binary_remote_addr zone=tcga_public_docs:10m rate=10r/s;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    font/woff2
    image/svg+xml
    text/css
    text/plain;

server {
    listen 80;
    server_name _;
    server_tokens off;
    # Keep redirects origin-relative. Apache terminates TLS in production, so
    # synthesizing an absolute URL here can otherwise downgrade https to http.
    absolute_redirect off;
    client_max_body_size 1m;
    limit_req_status 429;
    resolver 127.0.0.11 valid=30s ipv6=off;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Cache-Control $trace_cache_control always;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;

    set $backend_upstream backend:8000;
    set $frontend_upstream frontend:80;

    location = / {
        return 308 /tcga_explorer/$is_args$args;
    }

    location = /tcga_explorer {
        return 308 /tcga_explorer/$is_args$args;
    }

    location = /tcga_explorer/methods/signature-scoring {
        return 308 /tcga_explorer/methods/signature-scoring/$is_args$args;
    }

    location = /api {
        return 301 /api/;
    }

    location = /tcga_explorer/api {
        return 301 /tcga_explorer/api/;
    }

    # Operational endpoints remain available to containers, but are not public.
    location = /tcga_explorer/api/cache/status {
        return 404;
    }

    location = /tcga_explorer/api/data-sync/status {
        return 404;
    }

    location = /api/cache/status {
        return 404;
    }

    location = /api/data-sync/status {
        return 404;
    }

    # The upload route has an explicit allowance for the documented
    # expression + clinical file limits and multipart overhead.
    location = /tcga_explorer/api/v1/user-datasets {
        rewrite ^/tcga_explorer/api/(.*)$ /api/$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        send_timeout 300s;
        client_max_body_size 116m;
        limit_req zone=tcga_public_api burst=5 nodelay;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /tcga_explorer;
    }

    location /tcga_explorer/api/v1/ {
        rewrite ^/tcga_explorer/api/(.*)$ /api/$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        send_timeout 300s;
        # Bounded external-covariate datasets can be repeated across a public
        # batch request; Pydantic still enforces row, variable and value limits.
        client_max_body_size 64m;
        limit_req zone=tcga_public_api burst=30 nodelay;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /tcga_explorer;
    }

    location ~ ^/tcga_explorer/mcp/?$ {
        rewrite ^ /mcp break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        send_timeout 300s;
        client_max_body_size 4m;
        limit_req zone=tcga_public_api burst=30 nodelay;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keep the human/API descriptions public. The undocumented legacy
    # compute facade is deliberately not reachable through the edge proxy.
    location ~ ^/tcga_explorer/api/(docs|redoc|openapi\.json|guide|guia|docs-assets/[A-Za-z0-9_.-]+)$ {
        rewrite ^/tcga_explorer/api/(.*)$ /api/$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        send_timeout 60s;
        client_max_body_size 1m;
        limit_req zone=tcga_public_docs burst=30 nodelay;
        limit_except GET { deny all; }
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /tcga_explorer;
    }

    location /tcga_explorer/api/ {
        return 404;
    }

    location /api/ {
        return 404;
    }

    # Stream large installers without buffering them into the small tmpfs.
    location ^~ /tcga_explorer/downloads/desktop/ {
        rewrite ^/tcga_explorer/(.*)$ /$1 break;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        limit_except GET { deny all; }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stream reviewed films directly: the proxy's temporary filesystem is
    # intentionally small and must not buffer a complete HD video.
    location ^~ /tcga_explorer/tutorial-videos/ {
        rewrite ^/tcga_explorer/(.*)$ /$1 break;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        limit_except GET { deny all; }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
    }

    location ^~ /tutorial-videos/ {
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        limit_except GET { deny all; }
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
    }

    location ^~ /tcga_explorer/assets/ {
        rewrite ^/tcga_explorer/(.*)$ /$1 break;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tcga_explorer/ {
        rewrite ^/tcga_explorer/(.*)$ /$1 break;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /tcga_explorer;
        proxy_hide_header Cache-Control;
    }

    location /assets/ {
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
    }
}
